name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, screenshot verification
        run: ./gradlew assembleDebug testDebugUnitTest :app-headunit:verifyPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opentaiment-headunit-debug
          path: app-headunit/build/outputs/apk/debug/*.apk
