name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests (logic + Android Auto screens), screenshot verification
        run: >
          ./gradlew assembleDebug testDebugUnitTest
          :app-headunit:verifyPaparazziDebug :app-phone:verifyPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opentaiment-phone-debug
          path: app-phone/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opentaiment-tablet-debug
          path: app-headunit/build/outputs/apk/debug/*.apk
