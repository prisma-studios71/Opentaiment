<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Opentaiment – dane z auta przez OBD-II, Android Auto i radio z Androidem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#0F1A26"/>
      <stop offset="1" stop-color="#0B2233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66BB6A"/>
      <stop offset="0.6" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#EF5350"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B3E5FC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- road lines running to the right -->
  <g stroke="#4FC3F7" stroke-linecap="round" opacity="0.18">
    <path d="M1280 330 L900 420" stroke-width="3"/>
    <path d="M1280 250 L1060 420" stroke-width="2"/>
    <path d="M1180 372 L1140 392" stroke-width="8"/>
    <path d="M1250 338 L1215 356" stroke-width="7"/>
  </g>

  <!-- gauge -->
  <g transform="translate(285 215)">
    <circle r="150" fill="#0B0F14" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
    <path d="M-106 106 A150 150 0 1 1 106 106" transform="scale(0.85)" fill="none" stroke="#1E2A36" stroke-width="18" stroke-linecap="round"/>
    <path d="M-106 106 A150 150 0 1 1 106 106" transform="scale(0.85)" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round" stroke-dasharray="700 1000"/>
    <g stroke="#90A4AE" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M-78 78 L-68 68"/><path d="M-110 0 L-96 0"/><path d="M-78 -78 L-68 -68"/>
      <path d="M0 -110 L0 -96"/><path d="M78 -78 L68 -68"/><path d="M110 0 L96 0"/><path d="M78 78 L68 68"/>
    </g>
    <!-- steering wheel logo -->
    <g fill="none" stroke="#4FC3F7" stroke-linecap="round">
      <circle r="52" stroke-width="12"/>
      <path d="M-48 -4 L-16 0 M48 -4 L16 0 M0 15 L0 48" stroke-width="10"/>
    </g>
    <circle r="15" fill="#4FC3F7"/>
    <!-- needle -->
    <path d="M0 0 L74 -96" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <circle r="7" fill="#FFFFFF"/>
  </g>

  <!-- title -->
  <text x="490" y="190" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" fill="url(#title)" letter-spacing="-1">Opentaiment</text>
  <text x="494" y="242" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#B0BEC5">Twoje auto na ekranie – dane z OBD-II, radio i trasy.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600">
    <g transform="translate(494 280)">
      <rect width="168" height="44" rx="22" fill="#4FC3F7" fill-opacity="0.14" stroke="#4FC3F7" stroke-opacity="0.5"/>
      <text x="84" y="29" text-anchor="middle" fill="#4FC3F7">Android Auto</text>
    </g>
    <g transform="translate(676 280)">
      <rect width="226" height="44" rx="22" fill="#66BB6A" fill-opacity="0.14" stroke="#66BB6A" stroke-opacity="0.5"/>
      <text x="113" y="29" text-anchor="middle" fill="#81C784">Radio z Androidem</text>
    </g>
    <g transform="translate(916 280)">
      <rect width="124" height="44" rx="22" fill="#FFB74D" fill-opacity="0.14" stroke="#FFB74D" stroke-opacity="0.5"/>
      <text x="62" y="29" text-anchor="middle" fill="#FFB74D">OBD-II</text>
    </g>
    <g transform="translate(1054 280)">
      <rect width="148" height="44" rx="22" fill="#EF5350" fill-opacity="0.14" stroke="#EF5350" stroke-opacity="0.5"/>
      <text x="74" y="29" text-anchor="middle" fill="#EF9A9A">bez reklam</text>
    </g>
  </g>
</svg>
